<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WEB-Interia - Spustenie aplikacie</title>
  <meta name="description" content="Vstupna stranka projektu WEB-Interia pre otvorenie aplikacie v Codespaces.">
  <style>
    :root {
      --bg: #eef4fb;
      --panel: #ffffff;
      --text: #152238;
      --muted: #5f728c;
      --primary: #0f5ea8;
      --line: #d9e5f4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(15, 94, 168, 0.16), transparent 38rem),
        linear-gradient(180deg, #f7faff, var(--bg));
      padding: 1rem;
    }

    .panel {
      width: min(720px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1.4rem;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 .5rem;
      font-size: clamp(1.4rem, 3.2vw, 2.05rem);
      letter-spacing: -0.02em;
    }

    p {
      margin: .5rem 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      margin-top: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: .7rem .95rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      font-weight: 700;
      color: var(--text);
      background: #fff;
    }

    .btn.primary {
      color: #fff;
      border-color: var(--primary);
      background: linear-gradient(135deg, var(--primary), #0b3e6f);
    }

    code {
      background: #f3f7fc;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: .1rem .35rem;
    }

    .small {
      margin-top: .95rem;
      font-size: .93rem;
    }
  </style>
</head>
<body>
  <main class="panel" role="main">
    <h1>WEB-Interia sa presmeruje na aplikaciu</h1>
    <p>Spravna verzia webu bezi na porte <code>8000</code>.</p>
    <p id="status">Pripravujem verejny odkaz z aktualnej adresy...</p>

    <div class="row">
      <a class="btn primary" id="open-app" href="#">Otvorit aplikaciu</a>
    </div>

    <p class="small">Ak sa nic neotvori, v paneli Ports nastavte port 8000 na Public a otvorte jeho URL priamo z panelu.</p>
  </main>

  <script>
    (function () {
      function detectTargetUrl() {
        const protocol = window.location.protocol || "https:";
        const host = window.location.hostname || "";

        if (host.endsWith(".app.github.dev")) {
          return protocol + "//" + host.replace(/-\d+(\.app\.github\.dev)$/i, "-8000$1");
        }

        return null;
      }

      const target = detectTargetUrl();
      const openApp = document.getElementById("open-app");
      const status = document.getElementById("status");

      if (target) {
        openApp.href = target;
        status.textContent = "Kliknite na 'Otvorit aplikaciu'.";
        return;
      }

      openApp.setAttribute("aria-disabled", "true");
      openApp.style.pointerEvents = "none";
      openApp.style.opacity = "0.6";
      status.textContent = "Tato stranka ma byt otvorena cez Codespaces URL (*.app.github.dev), nie cez localhost.";
    })();
  </script>
</body>
</html>
